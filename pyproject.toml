[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pretty-plots"
version = "0.2.0"
description = "Publication-quality matplotlib styles, organized as families: planetary (default), idl (with per-journal variants and Hershey vector fonts), and more to come."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Paul O. Hayne", email = "paul.hayne@colorado.edu" },
    { name = "pretty_plots contributors" },
]
keywords = ["matplotlib", "publication", "plotting", "style", "planetary", "idl", "hershey", "colormap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.22",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mpl>=0.16", "pypdf>=4"]
dev = ["pytest>=7", "pytest-mpl>=0.16", "pypdf>=4", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/phayne/pretty-plots"
Issues = "https://github.com/phayne/pretty-plots/issues"

# Note: matplotlib doesn't auto-discover .mplstyle files via entry points.
# Each family's __init__.py (pretty_plots/idl/__init__.py and
# pretty_plots/planetary/__init__.py) appends its own styles/ directory to
# matplotlib.style.core.USER_LIBRARY_PATHS at import time, which makes plain
# names like plt.style.use("idl") and plt.style.use(["planetary", "planetary-latex"]) work.

[tool.hatch.build.targets.wheel]
packages = ["src/pretty_plots"]
# Hatch's package discovery picks up every file under packages/, including
# non-Python data (mplstyle, OTF, JHF, txt). No force-include needed —
# adding one would double-bundle the assets and trigger zipfile duplicate-
# name warnings.

[tool.hatch.build.targets.sdist]
include = [
    "src/pretty_plots",
    "tests",
    "examples",
    "tools",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
