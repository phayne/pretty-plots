[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "idl-style"
version = "0.1.0"
description = "IDL-style matplotlib: publication-quality plots with Helvetica-family sans-serif, inward ticks, rounded line caps, and embedded TrueType PDF output."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "idl_style contributors" }]
keywords = ["matplotlib", "idl", "publication", "plotting", "style", "hershey", "colormap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.22",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-mpl>=0.16", "pypdf>=4"]
dev = ["pytest>=7", "pytest-mpl>=0.16", "pypdf>=4", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/example/idl-style"
Issues = "https://github.com/example/idl-style/issues"

# Note: matplotlib doesn't auto-discover .mplstyle files via entry points;
# idl_style.__init__ instead appends src/idl_style/styles/ to
# matplotlib.style.core.USER_LIBRARY_PATHS at import time, which makes plain
# names like plt.style.use("idl") and plt.style.use(["idl", "idl-aas"]) work.

[tool.hatch.build.targets.wheel]
packages = ["src/idl_style"]

[tool.hatch.build.targets.wheel.force-include]
"src/idl_style/styles" = "idl_style/styles"
"src/idl_style/fonts" = "idl_style/fonts"
"src/idl_style/hershey/data" = "idl_style/hershey/data"

[tool.hatch.build.targets.sdist]
include = [
    "src/idl_style",
    "tests",
    "examples",
    "tools",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
